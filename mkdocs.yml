site_name: Kaid
site_description: Open source AI code review agent.
site_author: CHE3MZ
site_url: https://che3mz.github.io/kaid/
repo_url: https://github.com/che3mz/kaid

nav:
  - Home:
    - Kaid: index.md
    - FAQ: faq.md
  - Docs:
    - Installation: installation.md
    - Quickstart: quickstart.md
    - CLI Reference: cli-reference.md
    - Configuration: configuration.md
    - Architecture: architecture.md
    - Tools: tools.md
    - MCP: mcp.md
    - viewer: viewer.md
    - Review Rules: review-rules.md
    - Telemetry: telemetry.md
    - Chatgpt: chatgpt-preview.md
  - Integrations:
    - ci: integrations/ci.md
    - acp: integrations/acp.md
    - delegate: integrations/delegate.md

theme:
  name: "material"
  language: en
  logo: assets/icon.png
  favicon: assets/icon.png
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      primary: custom
      accent: custom
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: custom
      accent: custom
      scheme: kaid
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - footnotes