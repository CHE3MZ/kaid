# kaid - GitLab CI Merge Request Auto-Review Demo
#
# This pipeline automatically reviews Merge Requests using kaid
# and posts review comments (discussions) directly on the MR diff.
# Supports both same-repo and forked MR scenarios.
#
# Required CI/CD Variables (Settings → CI/CD → Variables):
#   KAID_LLM_URL        - LLM API endpoint (e.g., https://api.openai.com/v1/chat/completions)
#   KAID_LLM_AUTH_TOKEN - Authentication token for the LLM API (mark as "Masked")
#   KAID_LLM_MODEL      - Model name (e.g., gpt-4o). kaid has no built-in default model; the
#                        pipeline fails fast if this is unset.
#
# Not a CI/CD variable (hardcoded in the script below):
#   llm.use_anthropic  - Pinned to `false` (OpenAI-compatible APIs). GitLab CI/CD cannot
#                        store variables shorter than 8 chars, so this is set via
#                        `kaid config set llm.use_anthropic false`. To use Anthropic
#                        Claude, edit that line in the Configure kaid step to `true`.
#
# Optional CI/CD Variables (LLM provider configuration):
#   KAID_LANGUAGE          - Review output language, written via `kaid config set language`
#                          (e.g. English, Chinese). Defaults to kaid's built-in default (English).
#   KAID_LLM_AUTH_HEADER   - Custom auth header name, written via `kaid config set llm.auth_header`
#                          (e.g. "x-api-key" for some providers).
#   KAID_LLM_EXTRA_HEADERS - Extra headers "K=V,K=V", written via `kaid config set llm.extra_headers`.
#   KAID_LLM_TIMEOUT       - LLM request timeout in seconds (read natively by kaid from the env).
#                          Unset/empty = use kaid's default.
#
# Optional CI/CD Variables (review behavior, passed as `kaid review` flags):
#   KAID_REVIEW_CONCURRENCY - Max concurrent file reviews, passed via `--concurrency` (default: 8).
#   KAID_BACKGROUND         - Business/requirement context, passed via `--background` (e.g. MR title).
#   KAID_RULE               - Path to a custom rules JSON file, passed via `--rule`.
#
# Optional CI/CD Variables (versioning):
#   KAID_VERSION - release tag for kaid (default: latest).
#                 Pinning (e.g. "1.8.8") makes reviews reproducible.
#
# Optional CI/CD Variables (GitLab token):
#   GITLAB_API_TOKEN   - GitLab Personal/Project Access Token with "api" scope
#                        (falls back to CI_JOB_TOKEN if not set)
#
# Optional CI/CD Variables (for retry/delay tuning):
#   KAID_RETRY_BASE_DELAY    - Base delay (ms) for exponential backoff on rate-limit retries (default: 2000)
#   KAID_MAX_RETRIES         - Max retry attempts per comment when rate-limited or transient error (default: 3)
#   KAID_MAX_RETRY_DELAY     - Maximum delay (ms) per single retry, caps Retry-After/backoff (default: 60000)
#   KAID_SUCCESS_DELAY       - Delay (ms) after a successful comment post to pace requests (default: 2000)
#   KAID_FAILURE_DELAY       - Delay (ms) after a non-rate-limit failure to pace subsequent requests (default: 1000)
#   KAID_RATE_LIMIT_THRESHOLD - Proactively slow down when GitLab RateLimit-Remaining is at/below this value (default: 10, set 0 to disable)
#
# Optional CI/CD Variables (publication behavior, aligned with the GitHub Action):
#   KAID_STICKY_SUMMARY            - "true" updates the summary note in place across runs (default: true)
#   KAID_INCREMENTAL              - "true" skips comments whose line range overlaps prior bot discussions (default: false)
#   KAID_INCREMENTAL_OVERLAP_THRESHOLD - IoU threshold (0-1) for multi-line overlap (default: 0.6)
#   KAID_ROUTE_SEVERITY_BELOW     - route findings at/below this severity to the summary note (e.g. "low")
#   KAID_ROUTE_CATEGORIES         - comma-separated categories to route to the summary (e.g. "style,documentation")
#   KAID_FAIL_ON_SEVERITY         - fail the CI job when a comment's severity is at/above this level (e.g. "critical")
#
# Outputs (written under .kaid/ in the project directory so GitLab Runner can
# upload them as artifacts — Runner rejects paths outside the build dir):
#   .kaid/kaid-stats.env           - dotenv file with KAID_COMMENTS_{TOTAL,INLINE,SUMMARY,ROUTED,SKIPPED,FAILED}
#                                  and KAID_SUMMARY_URL, exposed to downstream jobs via the dotenv artifact.
#   .kaid/kaid-result.json         - raw `kaid review --format json` output (artifact).
#   .kaid/kaid-stderr.log          - kaid stderr (artifact).
#
# Note: The pipeline also configures llm.extra_body to '{"thinking": {"type": "disabled"}}'
#   to disable thinking mode for compatibility with various LLM providers.
#
# Fork MR Support:
#   The script uses CI_COMMIT_SHA as the diff target to correctly resolve the
#   source commit from forked repos. For some GitLab versions, you may need to enable:
#   Project Settings → CI/CD → General pipelines →
#     "Run pipelines in the parent project for merge requests from forked projects"

stages:
  - review

code-review:
  stage: review
  interruptible: true
  resource_group: mr-review-$CI_MERGE_REQUEST_IID
  image: node:20
  only:
    - merge_requests
  variables:
    GIT_DEPTH: 0  # Full history needed for merge-base diff
  script:
    # Install kaid
    # KAID_VERSION (optional) pins the release tag for reproducible reviews;
    # unset falls back to "latest".
    - |
      : "${KAID_VERSION:=latest}"
      curl -fsSL https://raw.githubusercontent.com/CHE3MZ/kaid/master/install.sh | KAID_VERSION="$KAID_VERSION" KAID_INSTALL_DIR=/usr/local/bin sh
      echo "kaid installed with version:" && kaid version || true

    # Configure kaid
    # Gitlab CI/CD does not support configuring variables with value length less than 8, so you can't set use_anthropic as a CI variable
    - |
      : "${KAID_LLM_URL:?set KAID_LLM_URL in Settings -> CI/CD -> Variables}"
      : "${KAID_LLM_AUTH_TOKEN:?set KAID_LLM_AUTH_TOKEN in Settings -> CI/CD -> Variables}"
      : "${KAID_LLM_MODEL:?set KAID_LLM_MODEL in Settings -> CI/CD -> Variables}"
      kaid config set llm.url "$KAID_LLM_URL"
      kaid config set llm.auth_token "$KAID_LLM_AUTH_TOKEN"
      kaid config set llm.model "$KAID_LLM_MODEL"
      kaid config set llm.use_anthropic false
      kaid config set llm.extra_body '{"thinking": {"type": "disabled"}}'
      # Optional config: only written when the CI var is non-empty, so an unset
      # variable does not clobber a previously-configured value.
      if [ -n "$KAID_LANGUAGE" ]; then kaid config set language "$KAID_LANGUAGE"; fi
      if [ -n "$KAID_LLM_AUTH_HEADER" ]; then kaid config set llm.auth_header "$KAID_LLM_AUTH_HEADER"; fi
      if [ -n "$KAID_LLM_EXTRA_HEADERS" ]; then kaid config set llm.extra_headers "$KAID_LLM_EXTRA_HEADERS"; fi
      # KAID_LLM_TIMEOUT is read natively by kaid from the env (no `kaid config set`
      # key exists for it); GitLab CI/CD variables are already exported into the
      # job env, so leaving it unset/empty = use kaid's default.

    # Run kaid review (use CI_COMMIT_SHA for --to to support both same-repo and forked MRs)
    # Optional review knobs (only passed when the CI var is non-empty):
    #   KAID_REVIEW_CONCURRENCY -> --concurrency
    #   KAID_BACKGROUND         -> --background
    #   KAID_RULE               -> --rule
    - |
      mkdir -p .kaid
      echo "Reviewing MR: ${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME} against ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
      ARGS=(--from "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" --to "${CI_COMMIT_SHA}" --format json --audience agent)
      if [ -n "$KAID_REVIEW_CONCURRENCY" ]; then ARGS+=(--concurrency "$KAID_REVIEW_CONCURRENCY"); fi
      if [ -n "$KAID_BACKGROUND" ]; then ARGS+=(--background "$KAID_BACKGROUND"); fi
      if [ -n "$KAID_RULE" ]; then ARGS+=(--rule "$KAID_RULE"); fi
      set +e
      kaid review "${ARGS[@]}" > .kaid/kaid-result.json 2>.kaid/kaid-stderr.log
      KAID_EXIT_CODE=$?
      set -e
      echo "KAID_EXIT_CODE=$KAID_EXIT_CODE"
      echo "=== kaid result ==="
      cat .kaid/kaid-result.json
      echo "=== kaid stderr ==="
      cat .kaid/kaid-stderr.log

    # Post review comments to MR
    # post_review.py lives alongside this file; copy both into your repo.
    # See examples/gitlab_ci/README.md for setup instructions.
    # NB: run unconditionally so a crashed kaid still surfaces its stderr on the
    # MR summary (post_review.py posts the stderr note on parse failure); the
    # job-fail gate below then turns the pipeline red on a non-zero kaid exit.
    # Capture the exit code so the gate below runs regardless of whether
    # post_review.py failed on severity gating or a posting error.
    - |
      set +e
      python3 post_review.py .kaid/kaid-result.json
      POST_EXIT_CODE=$?
      set -e

    # Fail the job on kaid error or severity gate (mirrors the GitHub Action).
    # post_review.py has already posted any stderr to the MR summary by this
    # point, so the failure is visible both as a red pipeline and on the MR.
    - |
      # Default kaid/POST exit codes so the gate below is safe even if a
      # prior step was skipped (e.g., post_review.py step never reached).
      : "${KAID_EXIT_CODE:=0}"
      : "${POST_EXIT_CODE:=0}"
      if [ "$KAID_EXIT_CODE" != "0" ]; then
        echo "kaid review exited with code ${KAID_EXIT_CODE}; see MR summary for stderr."
        exit "$KAID_EXIT_CODE"
      fi
      if [ "$POST_EXIT_CODE" != "0" ]; then
        echo "post_review.py exited with code ${POST_EXIT_CODE}; see MR summary for details."
        exit "$POST_EXIT_CODE"
      fi

  # Expose the review result, stderr, and posting stats to downstream jobs.
  # The dotenv report carries KAID_COMMENTS_* and KAID_SUMMARY_URL.
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .kaid/kaid-result.json
      - .kaid/kaid-stderr.log
    reports:
      dotenv: .kaid/kaid-stats.env
